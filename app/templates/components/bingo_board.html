<div class="grid grid-cols-5 gap-1 w-full max-w-md mx-auto aspect-square">
    {% for square in session.board %}
    {% set is_winning = square.id in session.winning_square_ids %}
    <button
        {% if not square.is_free_space %}
        hx-post="/toggle/{{ square.id }}"
        hx-target="#game-container"
        hx-swap="outerHTML"
        {% endif %}
        {% if square.is_free_space %}disabled{% endif %}
        class="relative flex items-center justify-center p-1 text-center border-2 rounded transition-all duration-200 select-none min-h-[60px] text-xs leading-tight font-semibold
        {%- if square.is_marked %}
            {%- if is_winning %} bg-gradient-to-br from-amber-400 to-amber-600 border-amber-500 text-amber-950 shadow-lg animate-glow
            {%- else %} bg-accent border-amber-300 text-white shadow-lg
            {%- endif %}
        {%- else %} bg-gray-50 text-gray-800 border-amber-400 active:bg-amber-100 hover:border-accent
        {%- endif %}
        {%- if square.is_free_space %} font-bold text-sm bg-gradient-to-br from-amber-500 to-amber-700 text-white border-amber-300{% endif %}"
        aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
        aria-label="{{ 'Free space' if square.is_free_space else square.text }}">
        <span class="wrap-break-word hyphens-auto">{{ square.text }}</span>
        {% if square.is_marked and not square.is_free_space %}
        <span class="absolute top-0.5 right-0.5 text-white text-sm font-bold">⚡</span>
        {% endif %}
    </button>
    {% endfor %}
</div>

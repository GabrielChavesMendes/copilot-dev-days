<div id="game-container">
<div class="flex flex-col min-h-full relative">
    <!-- Header with demon aesthetic -->
    <header class="flex items-center justify-between p-4 bg-gradient-to-r from-demon-deep-red to-demon-crimson border-b-2 border-amber-400 shadow-xl relative z-10">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="text-amber-500 hover:text-amber-300 text-sm px-3 py-1.5 rounded font-semibold uppercase tracking-wider hover:shadow-lg active:bg-gray-100">
            ← Retreat
        </button>
        <h1 class="font-bold text-amber-500 text-lg tracking-widest" style="text-shadow: 0 0 10px rgba(255, 68, 68, 0.6);">
            ⚔ DEMON SLAYER ⚔
        </h1>
        <div class="w-16"></div>
    </header>

    <!-- Mission briefing -->
    <p class="text-center text-amber-500 text-sm py-3 px-4 font-semibold uppercase tracking-wider">
        ✦ Find a slayer who matches this mission ✦
    </p>

    <!-- Victory indicator -->
    {% if session.has_bingo %}
    <div class="bg-gradient-to-r from-amber-900 to-amber-800 text-amber-200 text-center py-3 font-bold text-base border-b-2 border-amber-400 shadow-lg animate-pulse" style="text-shadow: 0 0 10px rgba(212, 165, 116, 0.6);">
        ⚡ DEMON DEFEATED! ⚡
    </div>
    {% endif %}

    <!-- Board container with mystical styling -->
    <div class="flex-1 flex items-center justify-center p-4 relative">
        <div class="animate-slide-in">
            {% include "components/bingo_board.html" %}
        </div>
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
